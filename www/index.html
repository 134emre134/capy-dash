<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Capy Dash</title>
<meta name="theme-color" content="#141826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capy Dash">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#141826;overflow:hidden;overscroll-behavior:none;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  canvas{display:block;image-rendering:pixelated;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script src="js/palette.js"></script>
<script src="js/engine.js"></script>
<script src="js/i18n.js"></script>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
  // offline support when served over http(s); harmless elsewhere
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
</body>
</html>
